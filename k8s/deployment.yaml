apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-dashboard
  labels:
    app: realtime-dashboard
spec:
  # Single replica on purpose: the event log is a SQLite file and the live buffer is
  # in memory, so replicas would each hold a different history. See README "Limitations".
  replicas: 1
  strategy:
    type: Recreate # the PVC is ReadWriteOnce
  selector:
    matchLabels:
      app: realtime-dashboard
  template:
    metadata:
      labels:
        app: realtime-dashboard
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realtime-dashboard
          # Build and push the image to your registry, then set it here.
          image: realtime-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3001'
            - name: DATA_DIR
              value: /app/data
            - name: TRUST_PROXY
              value: '1'
            - name: CRYPTO_SOURCE
              value: coingecko
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: realtime-dashboard-data
        - name: tmp
          emptyDir: {}
