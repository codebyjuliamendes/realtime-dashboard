<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-Driven Real-Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.05)',
                            200: 'rgba(255, 255, 255, 0.1)',
                            border: 'rgba(255, 255, 255, 0.15)'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .scroll-content {
            position: relative;
        }
        .warning-hidden {
            display: none !important;
        }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen flex flex-col antialiased">
    
    <!-- Performance Overlay -->
    <div id="perf-overlay" class="fixed bottom-4 right-4 z-50 glass-card px-4 py-2 rounded-lg text-xs font-mono text-slate-300 flex space-x-4 shadow-xl">
        <span>FPS: <span id="fps-counter" class="text-green-400 font-bold">0</span></span>
        <span>Msgs/sec: <span id="msg-rate" class="text-blue-400 font-bold">0</span></span>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-[9999]"></div>
    
    <!-- Header -->
    <header class="flex justify-between items-center p-6 border-b border-glass-border glass-card sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-green-500 pulse-dot" id="connection-indicator"></div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Nexus<span class="text-blue-500">Dash</span></h1>
        </div>
        <div class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20" id="status-bar">
            Connecting...
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="flex-grow p-6 w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Crypto Panel -->
        <section class="glass-card rounded-xl p-5 shadow-lg flex flex-col" id="crypto-panel">
            <h2 class="text-lg font-semibold text-white mb-4 flex items-center">
                <i data-lucide="bitcoin" class="w-5 h-5 mr-2 text-yellow-400"></i>
                Crypto Markets (Real-time)
            </h2>
            <div id="crypto-skeleton" class="animate-pulse flex-grow mb-4 flex space-x-4">
                <div class="flex-1 bg-slate-700/50 rounded-lg"></div>
            </div>
            <div class="relative flex-grow min-h-[250px] mb-4 hidden" id="crypto-content">
                <canvas id="cryptoChart"></canvas>
            </div>
            <div class="grid grid-cols-3 gap-4 mt-auto">
                <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
                    <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">BTC/USD</span>
                    <span class="block text-lg font-bold text-white font-mono" id="btc-price">---</span>
                </div>
                <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
                    <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">ETH/USD</span>
                    <span class="block text-lg font-bold text-white font-mono" id="eth-price">---</span>
                </div>
                <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
                    <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">SOL/USD</span>
                    <span class="block text-lg font-bold text-white font-mono" id="sol-price">---</span>
                </div>
            </div>
        </section>

        <!-- IoT Telemetry Panel -->
        <section class="glass-card rounded-xl p-5 shadow-lg flex flex-col" id="iot-panel">
            <h2 class="text-lg font-semibold text-white mb-4 flex items-center">
                <i data-lucide="activity" class="w-5 h-5 mr-2 text-cyan-400"></i>
                IoT Telemetry (High Frequency)
            </h2>
            <div id="iot-skeleton" class="animate-pulse flex-grow mb-4 flex space-x-4">
                <div class="flex-1 bg-slate-700/50 rounded-lg"></div>
            </div>
            <div class="relative flex-grow min-h-[250px] mb-4 hidden" id="iot-content">
                <canvas id="iotChart"></canvas>
            </div>
            <div class="grid grid-cols-3 gap-4 mt-auto">
                <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
                    <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">Avg Temp</span>
                    <span class="block text-lg font-bold text-white font-mono" id="avg-temp">---</span>
                </div>
                <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
                    <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">Avg CPU</span>
                    <span class="block text-lg font-bold text-white font-mono" id="avg-cpu">---</span>
                </div>
                <div class="bg-red-500/10 rounded-lg p-3 border border-red-500/30 warning-hidden flex flex-col justify-center" id="anomaly-alert">
                    <span class="block text-xs text-red-400 uppercase tracking-wider mb-1">Anomaly</span>
                    <span class="block text-sm font-bold text-red-500 truncate">High Temp</span>
                </div>
            </div>
        </section>

        <!-- Event Log Table (Virtual Scrolling) -->
        <section class="glass-card rounded-xl p-5 shadow-lg lg:col-span-2 flex flex-col" id="events-panel">
            <h2 class="text-lg font-semibold text-white mb-4 flex items-center">
                <i data-lucide="list" class="w-5 h-5 mr-2 text-purple-400"></i>
                System Event Log (100k+ rows)
            </h2>
            <div class="flex-grow flex flex-col overflow-hidden border border-slate-700 rounded-lg bg-slate-900/50">
                <!-- Table Header -->
                <div class="grid grid-cols-12 gap-4 p-3 bg-slate-800/80 border-b border-slate-700 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <div class="col-span-3">Timestamp</div>
                    <div class="col-span-2">Type</div>
                    <div class="col-span-7">Details</div>
                </div>
                <!-- Virtual Scroller Viewport -->
                <div class="relative flex-grow overflow-y-auto h-64" id="table-viewport">
                    <div class="scroll-content w-full" id="table-scroll-content">
                        <!-- Rows injected here by JS. We will ensure the JS creates grid-based rows -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/virtual-scroll.js"></script>
    <script type="module" src="js/chart-setup.js"></script>
    <script type="module" src="js/main.js"></script>
    <script>
        lucide.createIcons();
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'check-circle' : 'alert-circle';
            const color = type === 'success' ? 'text-green-400' : 'text-red-400';
            toast.className = `glass-card p-4 rounded-lg shadow-lg text-sm text-white flex items-center gap-3 transition-opacity duration-300`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${color}"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Simulate metrics loading
        setTimeout(() => {
            document.getElementById('crypto-skeleton').classList.add('hidden');
            document.getElementById('crypto-content').classList.remove('hidden');
            document.getElementById('iot-skeleton').classList.add('hidden');
            document.getElementById('iot-content').classList.remove('hidden');
            showToast('Metrics loaded successfully!', 'success');
        }, 2000);
    </script>
</body>
</html>
