services:
  app:
    build: .
    image: realtime-dashboard:local
    ports:
      - '${HOST_PORT:-3001}:3001'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATA_DIR: /app/data
    volumes:
      - dashboard-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  dashboard-data:
