name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t realtime-dashboard:ci .
      - name: Start container (demo crypto feed, no upstream needed)
        run: |
          docker run -d --name dash -p 3001:3001 -e CRYPTO_SOURCE=demo -e CRYPTO_POLL_MS=1000 realtime-dashboard:ci
      - name: Wait for healthy container
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dash)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' dash)" = "healthy" ]
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://127.0.0.1:3001/readyz
          curl -fsS http://127.0.0.1:3001/ | grep -q 'NexusDash'
          curl -fsS -o /dev/null http://127.0.0.1:3001/css/app.css
          curl -fsS -o /dev/null http://127.0.0.1:3001/vendor/chart.umd.min.js
          sleep 2
          curl -fsS 'http://127.0.0.1:3001/api/history?limit=5' | grep -q '"isSimulated":true'
          test "$(docker exec dash id -u)" != "0"
      - name: Graceful shutdown
        run: |
          docker stop -t 15 dash
          docker logs dash | tail -5
          docker logs dash | grep -q 'shutdown complete'
      - name: Container logs on failure
        if: failure()
        run: docker logs dash || true
